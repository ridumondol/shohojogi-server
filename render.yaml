services:
  - type: web
    name: shohojogi-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_DB_NAME
        value: shohojogi
      - key: CLIENT_URL
        sync: false
